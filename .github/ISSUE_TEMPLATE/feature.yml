name: 功能请求
description: 提议一项已被讨论过、希望进入开发的功能
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        还没想清楚、只是随口一提的想法，请先发 [Discussions](https://github.com/Sqhh99/FLiNG-Downloader/discussions)。

        这里只收已经能说清「要解决什么问题」的请求。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过 Issues 和 Discussions，没有重复提议
          required: true
        - label: 我说明的是要解决的问题，而不只是实现方案
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 当前工作流卡在哪里？谁会用到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的使用方式
      description: 用户会怎么点、怎么看到结果。实现细节可选。
    validations:
      required: true

  - type: textarea
    id: extras
    attributes:
      label: 补充
      description: 类似软件怎么做的、草图、是否愿意自己提 PR。
